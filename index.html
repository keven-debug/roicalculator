<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Axya Value Estimator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --ink:#0B1424; --ink2:#4B5768; --ink3:#6B7686; --line:#E7EAF0; --bg:#F8F9FC; --card:#fff;
  --blue:#2682FD; --blue2:#1866DB; --navy:#061736; --pill:#F2F7FF;
  --c1:#2682FD; --c2:#6C5CE7; --c3:#12B5A6; --c4:#F59E0B; --c5:#E5484D;
  --shadow:0 1px 2px rgba(11,20,36,.04),0 8px 28px rgba(11,20,36,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.5 "Google Sans Flex","Google Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(248,249,252,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px}
.top img{height:26px;display:block}
.dots{display:flex;gap:6px;margin-left:auto;align-items:center}
.dots i{width:28px;height:4px;border-radius:4px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--blue)}
.cur{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px;display:flex}
.cur button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink3)}
.cur button.on{background:var(--ink);color:#fff}
main{max-width:1080px;margin:0 auto;padding-block:28px 80px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.grid>*,.welcome>*{min-width:0}
.fade{animation:in .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{transform:translateY(12px)}to{transform:none}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue2)}
h1{font-size:clamp(30px,5vw,50px);line-height:1.08;font-weight:500;letter-spacing:-.02em;margin:10px 0 14px}
h2{font-size:clamp(24px,3.4vw,32px);line-height:1.15;font-weight:500;letter-spacing:-.015em;margin:8px 0 6px}
p.lead{font-size:18px;color:var(--ink2);max-width:620px;margin:0 0 26px}
.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:600;background:var(--blue);color:#fff;transition:transform .12s,background .2s,box-shadow .2s;box-shadow:0 6px 18px rgba(38,130,253,.3)}
.btn:hover{background:var(--blue2);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--pill)}
.btn.sm{padding:9px 14px;border-radius:10px;font-size:14px}
.welcome{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;align-items:center;padding-top:28px}
.how{background:var(--navy);color:#fff;border-radius:20px;padding:26px;box-shadow:var(--shadow)}
.how h3{margin:0 0 14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8DBEFF}
.how li{margin:0 0 14px;padding-left:4px;color:#D6E4FA}
.how li b{color:#fff;font-weight:600}
.how ol{margin:0;padding-left:20px}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:14px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow)}
.field{padding:18px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0;padding-top:8px}
.field .row{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.field label{font-weight:600;display:block}
.field small{color:var(--ink3);font-size:13.5px;display:block}
.num{width:150px;flex:none;text-align:right;font:inherit;font-size:20px;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;font-variant-numeric:tabular-nums}
.num:focus,.asm:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
input[type=range]{width:100%;margin:16px 0 0;accent-color:var(--blue);height:6px}
.nav{display:flex;justify-content:space-between;margin-top:22px}
.think{background:linear-gradient(180deg,#F2F7FF,#fff);border:1px solid #D6E6FF;border-radius:18px;padding:22px;position:sticky;top:76px}
.think h3{margin:0 0 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue2);display:flex;align-items:center;gap:8px}
.think h3:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 0 rgba(38,130,253,.5);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(38,130,253,0)}100%{box-shadow:0 0 0 0 rgba(38,130,253,0)}}
.think p{margin:0 0 12px;color:var(--ink2);font-size:15px}
.think b{color:var(--ink);font-variant-numeric:tabular-nums}
.think .why{font-size:13px;color:var(--ink3);border-top:1px dashed #C9DCFB;padding-top:10px;margin:14px 0 0}
.calc{max-width:560px;margin:60px auto;text-align:center}
.calc ul{list-style:none;padding:0;margin:26px 0 0;text-align:left}
.calc li{display:flex;gap:12px;align-items:center;padding:12px 16px;margin-bottom:8px;background:#fff;border:1px solid var(--line);border-radius:12px;opacity:0;transform:translateY(8px);transition:.35s}
.calc li.on{opacity:1;transform:none}
.calc li span{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.tick{width:20px;height:20px;border-radius:50%;background:var(--blue);flex:none;position:relative}
.tick:after{content:"";position:absolute;left:6px;top:5px;width:6px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg) translate(-1px,-1px)}
.big{background:var(--navy);color:#fff;border-radius:22px;padding:34px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.big:after{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(38,130,253,.55),transparent)}
.big .eyebrow{color:#8DBEFF}
.big .amt{font-size:clamp(44px,8vw,84px);line-height:1;font-weight:500;letter-spacing:-.03em;margin:12px 0 4px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.big .per{color:#B8CCEC;font-size:18px;position:relative;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;font-size:14px;color:#D6E4FA}
.chip b{display:block;font-size:20px;color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.stack{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:6px 0 4px;background:var(--line)}
.stack i{height:100%;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.sec{margin-top:26px}
.sec>h2{font-size:22px}
.sec>p{color:var(--ink3);margin:0 0 14px;font-size:15px}
details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;display:grid;grid-template-columns:14px 1fr auto 18px;gap:14px;align-items:center;padding:16px 18px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary:hover{background:#FAFBFE}
.dot{width:12px;height:12px;border-radius:4px}
summary .t{font-weight:600}
summary .t small{display:block;font-weight:400;color:var(--ink3);font-size:13.5px}
summary .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
summary .v small{display:block;font-size:12.5px;font-weight:500;color:var(--blue2)}
.chev{width:9px;height:9px;border:solid var(--ink3);border-width:0 2px 2px 0;transform:rotate(45deg);transition:.2s;justify-self:center}
details[open] .chev{transform:rotate(-135deg)}
.math{padding:4px 18px 18px 46px;border-top:1px dashed var(--line);background:#FCFDFF}
.math .what{color:var(--ink2);font-size:14.5px;margin:14px 0 10px}
.math .ln{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid #F0F2F6;font-size:14.5px;color:var(--ink2);flex-wrap:wrap}
.math .ln b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.math .ln.tot{border-bottom:0;font-weight:600;color:var(--ink)}
.math .ln.tot b{color:var(--blue2);font-size:17px}
.asm{width:64px;font:inherit;font-weight:600;color:var(--blue2);text-align:center;border:1px solid #C9DCFB;background:var(--pill);border-radius:8px;padding:3px 4px;margin:0 2px}
.asm.meas{color:#0B7A6E;border-color:#A9E3DC;background:#EEFBF9}
.src{font-size:13px;color:#0B7A6E;background:#EEFBF9;border-radius:8px;padding:8px 10px;margin:10px 0 0}
.key{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin:0 4px 0 8px;border:1px solid}
.note{font-size:13px;color:var(--ink3);margin-top:10px}
.warn{background:#FFF7E6;border:1px solid #F9DFA6;color:#7A5200;border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:12px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}
.pay .out{background:var(--pill);border-radius:14px;padding:20px;min-height:112px;display:flex;flex-direction:column;justify-content:center}
.pay .out .n{font-size:34px;font-weight:600;color:var(--blue2);line-height:1.1;font-variant-numeric:tabular-nums}
.prove{background:var(--navy);color:#fff;border-radius:18px;padding:26px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.prove ul{margin:10px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;color:#D6E4FA;font-size:15px}
.prove li:before{content:"•";color:#8DBEFF;margin-right:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.gate{max-width:560px;margin:28px auto 0}
.gate .card{margin-top:18px}
.gate .in{display:block;width:100%;font:inherit;font-size:17px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 0;background:#fff}
.gate .in:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.gate .in.bad{border-color:var(--c5)}
.gate .err{color:#B42318;font-size:14px;margin:12px 0 0;min-height:0}
.gate .fine{font-size:13px;color:var(--ink3);margin:14px 0 0}
.gate ul.teaser{list-style:none;padding:0;margin:0 0 6px;display:grid;gap:8px}
.gate ul.teaser li{display:flex;gap:10px;align-items:center;color:var(--ink2);font-size:15px}
.hsf form{margin-top:4px}
.hsf .hs-form-field{padding:14px 0 0}
.hsf .hs-form-field.hs-hide{display:none!important}
.hsf label{font-weight:600;display:block}
.hsf .hs-field-desc{color:var(--ink3);font-size:13.5px}
.hsf .hs-input:not([type=checkbox]):not([type=radio]){display:block;width:100%!important;font:inherit;font-size:17px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 0;background:#fff}
.hsf .hs-input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.hsf .hs-input.invalid,.hsf .hs-input.error{border-color:var(--c5)}
.hsf fieldset{max-width:none!important;border:0;padding:0;margin:0}
.hsf .input{margin:0!important}
.hsf ul.hs-error-msgs,.hsf ul.no-list{list-style:none;padding:0;margin:6px 0 0}
.hsf .hs-error-msg,.hsf .hs-main-font-element{color:#B42318;font-size:14px;font-weight:400}
.hsf .legal-consent-container{font-size:13px;color:var(--ink3);margin-top:12px}
.hsf .hs_submit{margin-top:20px}
.hsf .hs-button{border:0;border-radius:12px;padding:14px 22px;font:inherit;font-weight:600;background:var(--blue);color:#fff;cursor:pointer;width:100%;box-shadow:0 6px 18px rgba(38,130,253,.3)}
.hsf .hs-button:hover{background:var(--blue2)}
.btn[disabled]{opacity:.6;cursor:wait;transform:none}
.btn.export{display:inline-flex;align-items:center;gap:8px}
.btn.export svg{width:16px;height:16px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (max-width:820px){
  .welcome,.grid,.pay,.prove{grid-template-columns:1fr}
  .think{position:static}
  .prove ul{grid-template-columns:1fr}
  .num{width:124px;font-size:18px}
  .math{padding-left:18px}
  .big{padding:24px}
  .dots i{width:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.actions,.nav,canvas,.toast{display:none!important}body{background:#fff}details{break-inside:avoid}.big,.prove{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

const DEFAULTS = {
  step:0, cur:'CAD',

  // 44 customers, 33,868 POs, 98,622 lines; classification jobs and thread events over 90 days). The rest are assumptions.
  a:{ emailsPerPo:3, minPerEmail:2, mailboxAuto:86,
      minPerLine:1.5, confAuto:61,
      chasePct:40, minPerChase:5, chaseAuto:90,
      criticalPct:20, expediteCost:400, lateReduction:30,
      volatilePct:16, identifiedPct:2.5, recoveredPct:10 }
};
let S = structuredClone(DEFAULTS);
// ---- Lead capture (HubSpot Forms API, no key needed) ----
const HS = { portal:'5408365', region:'na1', form:'61d0077b-e31a-4c56-bccb-c48207498154',
  // Hidden multi-line text field on the form that receives the results summary.
  // It must exist on the form, otherwise the summary is dropped and only email + company are sent.
  resultsField:'website_roi_calculator_form', altFields:['message'] };
let LEAD = null; // {email, company} once the gate is passed; survives "Start over"
const QS = new URLSearchParams(location.search);
const MEASURED = new Set(['emailsPerPo','mailboxAuto','confAuto','volatilePct','criticalPct']);
const open = new Set(['mailbox']);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (q, el=document) => el.querySelector(q);
const app = $('#app');

const money = n => new Intl.NumberFormat('en-CA',{style:'currency',currency:S.cur,currencyDisplay:'narrowSymbol',maximumFractionDigits:0}).format(Math.round(n||0));
const short = n => { const a=Math.abs(n); const s = a>=1e6 ? (a/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M' : a>=1e4 ? Math.round(a/1e3)+'K' : Math.round(a).toLocaleString('en-CA'); return '$'+s; };
const num = (n,d=0) => (n||0).toLocaleString('en-CA',{minimumFractionDigits:d,maximumFractionDigits:d});
const parse = v => { const n = parseFloat(String(v).replace(/[^0-9.]/g,'')); return isFinite(n) ? n : 0; };

function calc(){
  const a = S.a, rate = S.cost/2080, lines = S.pos*S.lpp;
  const emails = S.pos*a.emailsPerPo;
  const mailAll = emails*a.minPerEmail/60, mailH = mailAll*a.mailboxAuto/100;
  const confAll = lines*a.minPerLine/60, confH = confAll*a.confAuto/100;
  const chases = S.pos*a.chasePct/100, chaseAll = chases*a.minPerChase/60, chaseH = chaseAll*a.chaseAuto/100;
  const hours = mailH+confH+chaseH;
  const lateLines = lines*S.latePct/100, expedites = lateLines*a.criticalPct/100;
  const lateCost = expedites*a.expediteCost, lateV = lateCost*a.lateReduction/100;
  const volatile = S.spend*a.volatilePct/100, identified = volatile*a.identifiedPct/100, priceV = identified*a.recoveredPct/100;
  const total = hours*rate + lateV + priceV;
  return {rate, lines, emails, mailAll, mailH, confAll, confH, chases, chaseAll, chaseH, hours,
    fte:hours/2080, perBuyerWeek:hours/Math.max(S.buyers,1)/52,
    lateLines, expedites, expAvoided:expedites*a.lateReduction/100, lateCost, lateV,
    volatile, identified, priceV, timeV:hours*rate, total,
    payback: S.quote>0 && total>0 ? S.quote/(total/12) : null, multiple: S.quote>0 ? total/S.quote : null};
}

// Falls back to customGate() (Forms API) if the HubSpot embed can't load.
function loadHubSpot(){
  if (window.hbspt?.forms) return Promise.resolve();
  return loadHubSpot.p ||= new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'https://js.hsforms.net/forms/embed/v2.js'; s.charset = 'utf-8';
    s.onload = () => window.hbspt?.forms ? ok() : ko(new Error('hbspt missing'));
    s.onerror = () => { loadHubSpot.p = null; ko(new Error('HubSpot embed failed to load')); };
    document.head.appendChild(s);
  });
}

// Set a value so HubSpot's form state (React) sees it, not just the DOM.
function setVal(el, v){
  const set = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el), 'value')?.set;
  set ? set.call(el, v) : (el.value = v);
  el.dispatchEvent(new Event('input', {bubbles:true})); el.dispatchEvent(new Event('change', {bubbles:true}));
}

  app.innerHTML = `<section class="gate fade">

  $('#back').onclick = () => go(3);

  // HubSpot fills hidden fields from the page's query string when the form renders (its documented way).

      const q = n => form.querySelector(`[name="${n}"]`);
      const msg = [HS.resultsField, ...HS.altFields].map(q).find(Boolean);
      if (!msg) console.warn(`[Axya ROI] No "${HS.resultsField}" field on the HubSpot form, the summary will not be sent`);
      msg?.closest('.hs-form-field')?.classList.add('hs-hide');

      const form = f.jquery ? f[0] : f, q = n => form.querySelector(`[name="${n}"]`)?.value.trim() || '';

      LEAD = gate.pending || {email:'', company:''}; render(); scrollTo(0,0); toTop(); }
  })).catch(x => { console.warn('[Axya ROI]', x); clearTimeout(fallback); if (S.step === 4 && !LEAD) customGate(); });

// Sends email, company and a plain-text results summary to the HubSpot form.
// HubSpot then sends its submission notification (set the recipients in the form's settings).
async function submitLead(email, company){
  const url = `https://api.hsforms.com/submissions/v3/integration/submit/${HS.portal}/${HS.form}`;
  const base = [{objectTypeId:'0-1', name:'email', value:email}, {objectTypeId:'0-1', name:'company', value:company}];
  const context = { pageUri: document.referrer || location.href, pageName:'Axya Value Estimator' };
  const hutk = QS.get('hutk'); if (hutk) context.hutk = hutk;
  const send = fields => fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({fields, context})})
    .then(async r => ({ok:r.ok, body: await r.json().catch(()=>({}))}));
  try {
    let r = await send(HS.resultsField ? [...base, {objectTypeId:'0-1', name:HS.resultsField, value:summaryText(email, company)}] : base);
    const types = b => (b.errors||[]).map(x=>x.errorType||'');
    if (!r.ok && types(r.body).includes('FIELD_NOT_IN_FORM_DEFINITION')) {
      console.warn(`[Axya ROI] Field "${HS.resultsField}" is not on the HubSpot form. Sending email + company only.`);
      r = await send(base);
    }
    if (r.ok) return {ok:true};
    const t = types(r.body);
    if (t.includes('BLOCKED_EMAIL')) return {emailError:'Please use your work email address.'};
    if (t.includes('INVALID_EMAIL')) return {emailError:'That email address does not look right.'};
    console.warn('[Axya ROI] HubSpot submission failed', r.body);
    return {ok:false};
  } catch (x) { console.warn('[Axya ROI] HubSpot submission failed', x); return {ok:false}; }
}

function inputRows(){
  return [
    ['Buyers managing orders', num(S.buyers)],
    ['Yearly cost of one buyer', money(S.cost)],
    ['Purchase orders per year', num(S.pos)],
    ['Lines per purchase order', num(S.lpp, Number.isInteger(S.lpp)?0:1)],
    ['PO lines that arrive late', num(S.latePct)+'%'],
    ['Yearly purchasing spend', money(S.spend)]];
}

function summaryText(email='', company=''){
  const r = calc(), it = valueItems(r, (k,s='')=>S.a[k]+s);
  return [
    'AXYA VALUE ESTIMATOR - RESULTS',
    ...(company ? [`Company: ${company}`] : []), ...(email ? [`Email: ${email}`] : []), `Currency: ${S.cur}`, '',
    'INPUTS', ...inputRows().map(x=>`- ${x[0]}: ${x[1]}`), '',
    'RESULTS',
    `- Total yearly value: ${money(r.total)}`,
    `- Cautious case (60%): ${money(r.total*.6)}`,
    `- Buyer time back: ${num(r.hours)} h/year (${num(r.fte,1)} FTE, ${num(r.perBuyerWeek,1)} h per buyer per week)`,
    `- Rush orders avoided: ${num(r.expAvoided)}`, '',
    'BREAKDOWN', ...it.map(i=>`- ${i.name}: ${money(i.v)} (${i.tag})`)
  ].join('\n');
}

// ---------- PDF export ----------
function loadJsPdf(){
  if (window.jspdf) return Promise.resolve(window.jspdf);
  return loadJsPdf.p ||= new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = () => window.jspdf ? ok(window.jspdf) : ko(new Error('jsPDF missing'));
    s.onerror = () => { loadJsPdf.p = null; ko(new Error('jsPDF failed to load')); };
    document.head.appendChild(s);
  });
}

async function exportPdf(){
  const b = $('#export'), label = b.innerHTML;
  b.disabled = true; b.lastChild.textContent = 'Preparing PDF…';
  try { const {jsPDF} = await loadJsPdf(); buildPdf(jsPDF, LEAD?.company).save(pdfName(LEAD?.company)); toast('PDF downloaded'); }
  catch (x) { console.warn(x); window.print(); }
  finally { b.disabled = false; b.innerHTML = label; }
}

const pdfName = c => `Axya-value-estimate-${(c||'results').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')}.pdf`;
function buildPdf(jsPDF, company=''){
  const r = calc(), items = valueItems(r, (k,s='')=>k==='expediteCost' ? money(S.a[k]) : num(S.a[k], Number.isInteger(S.a[k])?0:1)+s);
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const W = 612, H = 792, M = 48, CW = W - 2*M;
  const C = { ink:'#0B1424', ink2:'#4B5768', ink3:'#6B7686', line:'#E7EAF0', blue:'#2682FD', blue2:'#1866DB',
    navy:'#061736', pill:'#F2F7FF', light:'#8DBEFF', soft:'#D6E4FA', green:'#0B7A6E', greenBg:'#EEFBF9',
    c1:'#2682FD', c2:'#6C5CE7', c3:'#12B5A6', c4:'#F59E0B', c5:'#E5484D' };
  const date = new Date().toLocaleDateString('en-CA', {year:'numeric', month:'long', day:'numeric'});
  let y = M;
  const font = (size, style='normal', color=C.ink) => { doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(color); };
  const need = h => { if (y + h > H - 56) { doc.addPage(); y = M; } };
  const wrap = (t, w) => doc.splitTextToSize(String(t), w);
  const eyebrow = (t, x, yy, color=C.blue2) => { font(8, 'bold', color); doc.setCharSpace(1); doc.text(t.toUpperCase(), x, yy); doc.setCharSpace(0); };

  // Header
  const logo = document.querySelector('.top img');
  if (logo) doc.addImage(logo.src, 'PNG', M, y, 72, 22);
  font(9, 'normal', C.ink3);
  doc.text(`Value estimate · ${date}`, W-M, y+8, {align:'right'});
  if (company) { font(10, 'bold', C.ink); doc.text(`Prepared for ${company}`, W-M, y+22, {align:'right'}); }
  y += 44;

  // Hero
  const heroH = 168;
  doc.setFillColor(C.navy); doc.roundedRect(M, y, CW, heroH, 14, 14, 'F');
  eyebrow('Your estimate', M+24, y+30, C.light);
  font(40, 'normal', '#FFFFFF'); doc.text(money(r.total), M+24, y+72);
  font(12, 'normal', '#B8CCEC'); doc.text('of value a year, once Axya is fully rolled out', M+24, y+92);
  const chips = [
    [`${num(r.hours)} h`, `buyer time back (${num(r.fte,1)} FTE)`],
    [num(r.expAvoided), 'rush orders avoided'],
    [money(r.total*.6), 'if only 60% materialises']];
  const cw = (CW - 48 - 16) / 3;
  chips.forEach((c, i) => {
    const x = M + 24 + i*(cw+8);
    doc.setFillColor('#1A2A48'); doc.roundedRect(x, y+108, cw, 42, 8, 8, 'F');
    font(13, 'bold', '#FFFFFF'); doc.text(c[0], x+10, y+125);
    font(8.5, 'normal', C.soft); doc.text(c[1], x+10, y+140);
  });
  y += heroH + 26;

  // Inputs
  font(15, 'bold'); doc.text('Your answers', M, y); y += 8;
  font(9.5, 'normal', C.ink3); doc.text('The six numbers this estimate is built on.', M, y+12); y += 22;
  const rows = inputRows(), colW = (CW - 12) / 2, rowH = 30;
  doc.setFillColor(C.pill); doc.roundedRect(M, y, CW, Math.ceil(rows.length/2)*rowH + 12, 10, 10, 'F');
  rows.forEach((row, i) => {
    const x = M + 14 + (i%2)*(colW+12), yy = y + 12 + Math.floor(i/2)*rowH;
    font(9.5, 'normal', C.ink2); doc.text(row[0], x, yy+13);
    font(11, 'bold'); doc.text(row[1], x + colW - 28, yy+13, {align:'right'});
    if (i < rows.length-2) { doc.setDrawColor('#DCE6F7'); doc.setLineWidth(.6); doc.line(x, yy+rowH-4, x+colW-28, yy+rowH-4); }
  });
  y += Math.ceil(rows.length/2)*rowH + 12 + 28;

  // Breakdown
  need(80);
  font(15, 'bold'); doc.text('How we got there', M, y); y += 8;
  font(9.5, 'normal', C.ink3);
  doc.text(`Five things Axya does, each priced with your numbers. Time back is ${num(r.perBuyerWeek,1)} hours per buyer per week.`, M, y+12);
  y += 24;
  let bx = M; const tot = r.total || 1;
  items.forEach(i => { const w = CW * i.v / tot; if (w > 0) { doc.setFillColor(C[i.c.slice(2)]); doc.rect(bx, y, w, 7, 'F'); bx += w; } });
  y += 22;

  items.forEach(i => {
    font(9); const what = wrap(i.what, CW - 28);
    font(8.5); const src = i.src ? wrap(i.src, CW - 48) : [];
    const cardH = 52 + what.length*12 + 2 + i.lines.length*18 + (src.length ? 6 + src.length*11 + 10 : 0) + 12;
    need(cardH);
    doc.setDrawColor(C.line); doc.setLineWidth(.8); doc.roundedRect(M, y, CW, cardH, 10, 10, 'S');
    doc.setFillColor(C[i.c.slice(2)]); doc.roundedRect(M+14, y+15, 8, 8, 2, 2, 'F');
    font(11.5, 'bold'); doc.text(i.name, M+30, y+22);
    font(13, 'bold', C.ink); doc.text(money(i.v), W-M-14, y+22, {align:'right'});
    font(8.5, 'normal', C.blue2); doc.text(i.tag, W-M-14, y+34, {align:'right'});
    font(9, 'normal', C.ink3); doc.text(i.sub, M+30, y+34);
    let yy = y + 52;
    font(9, 'normal', C.ink2); doc.text(what, M+14, yy); yy += what.length*12 + 2;
    i.lines.forEach(l => {
      const tot = !!l[2];
      font(9.5, tot ? 'bold' : 'normal', tot ? C.ink : C.ink2); doc.text(l[0], M+14, yy+8);
      font(tot ? 10.5 : 9.5, 'bold', tot ? C.blue2 : C.ink); doc.text(l[1], W-M-14, yy+8, {align:'right'});
      if (!tot) { doc.setDrawColor('#F0F2F6'); doc.line(M+14, yy+14, W-M-14, yy+14); }
      yy += 18;
    });
    if (src.length) {
      yy += 6; doc.setFillColor(C.greenBg); doc.roundedRect(M+14, yy, CW-28, src.length*11 + 10, 6, 6, 'F');
      font(8.5, 'normal', C.green); doc.text(src, M+24, yy+12);
    }
    y += cardH + 10;
  });

  // Payback
  if (r.payback) {
    need(70); y += 6;
    doc.setFillColor(C.pill); doc.roundedRect(M, y, CW, 58, 10, 10, 'F');
    eyebrow('Payback', M+16, y+20);
    font(16, 'bold', C.blue2); doc.text(r.payback < 1 ? 'Under 1 month' : `${num(r.payback,1)} months`, M+16, y+42);
    font(9.5, 'normal', C.ink2);
    font(9.5, 'normal', C.ink2); doc.text(wrap(`of value covers a yearly quote of ${money(S.quote)}. Over a full year that is ${num(r.multiple,1)}x what you pay.`, CW-190), M+170, y+30);
    y += 76;
  }

  // Pilot CTA
  need(110); y += 6;
  doc.setFillColor(C.navy); doc.roundedRect(M, y, CW, 96, 12, 12, 'F');
  eyebrow('Prove it first', M+20, y+24, C.light);
  font(14, 'bold', '#FFFFFF'); doc.text('An estimate is not a result. A pilot is.', M+20, y+44);
  font(9.5, 'normal', C.soft);
  ['90-day pilot from go-live', 'Baseline measured in week 1', 'Success is your number', 'Miss it at day 90, opt out']
    .forEach((t, i) => doc.text('•  ' + t, M+20 + (i%2)*200, y+64 + Math.floor(i/2)*15));
  doc.setFillColor(C.blue); doc.roundedRect(W-M-150, y+34, 130, 30, 8, 8, 'F');
  font(10, 'bold', '#FFFFFF'); doc.textWithLink('Talk to us', W-M-85, y+53, {url:'https://www.axya.co', align:'center'});
  doc.link(W-M-150, y+34, 130, 30, {url:'https://www.axya.co'});
  y += 112;

  // Disclaimer
  font(8); const note = wrap('Estimates only. Measured figures are averages across Axya customers and yours will differ. Minutes per task and the other assumptions should be replaced by what the pilot measures. Time back is capacity for your team, not a cash saving, unless it replaces a hire or overtime.', CW);
  need(note.length*10 + 4);
  font(8, 'normal', C.ink3); doc.text(note, M, y);

  // Footer on every page
  const n = doc.getNumberOfPages();
  for (let p = 1; p <= n; p++) {
    doc.setPage(p); font(8, 'normal', C.ink3);
    doc.text('axya.co · Axya Value Estimator', M, H-28);
    doc.text(`${p} / ${n}`, W-M, H-28, {align:'right'});
  }
  return doc;
}

function payout(){
  const r = calc(), el = $('#payout'); if (!el) return;
  if (!r.payback) { el.innerHTML = `<span style="color:var(--ink3)">Add your quote and we will show how many months of value cover a year of Axya.</span>`; return; }
  const m = r.payback, first = payout.shown !== true;
  el.innerHTML = `<div class="n">${m<1?'Under 1 month':num(m,1)+' months'}</div>
    <div style="color:var(--ink2)">of value covers the yearly cost. Over a full year that is <b>${num(r.multiple,1)}×</b> what you pay${r.multiple*.6>=1?`, and still ${num(r.multiple*.6,1)}× in the cautious case.`:'.'}</div>`;
  if (first && r.multiple>=3) { payout.shown = true; celebrate(60); }
}

function countUp(el, from, to){
  if (reduce || from===to) { el.textContent = money(to); return; }
  const t0 = performance.now(), d = 1100;
  (function f(t){ const p = Math.min(1,(t-t0)/d), e = 1-Math.pow(1-p,4); el.textContent = money(from+(to-from)*e); if (p<1) requestAnimationFrame(f); })(t0);
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),1800); }

function celebrate(n=160){
  if (reduce) return;
  const c = $('#fx'), x = c.getContext('2d'), dpr = devicePixelRatio||1;
  c.width = innerWidth*dpr; c.height = innerHeight*dpr; x.scale(dpr,dpr);
  const cols = ['#2682FD','#8DBEFF','#6C5CE7','#12B5A6','#F59E0B','#ffffff'];
  const ps = Array.from({length:n},(_,i)=>{ const side = i%2 ? 1 : -1; return {
    x: innerWidth/2 + side*innerWidth*.32, y: innerHeight*.55,
    vx: -side*(2+Math.random()*7), vy: -(9+Math.random()*9), r: 4+Math.random()*5, c: cols[i%cols.length],
    a: Math.random()*6.28, va: (Math.random()-.5)*.4, life: 1 }; });
  const id = celebrate.id = (celebrate.id||0)+1;
  (function f(){
    if (id!==celebrate.id) return;
    x.clearRect(0,0,innerWidth,innerHeight); let alive = false;
    for (const p of ps){ p.vy += .28; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life -= .007;
      if (p.life>0 && p.y<innerHeight+20){ alive = true; x.save(); x.globalAlpha = Math.min(1,p.life*2); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r,-p.r/2,p.r*2,p.r); x.restore(); } }
    alive ? requestAnimationFrame(f) : x.clearRect(0,0,innerWidth,innerHeight);
  })();
}

document.querySelectorAll('.cur button').forEach(b=>b.onclick=()=>{ S.cur=b.dataset.cur; render(); });
render();
// Tell the parent page our height so the iframe can grow with the content.
if (window.parent !== window) {
  const post = () => parent.postMessage({type:'axya-roi-height', height:document.documentElement.scrollHeight}, '*');
  new ResizeObserver(post).observe(document.body); addEventListener('load', post);
}
</script>
